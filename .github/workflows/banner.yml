name: banner

# Hourly: re-assemble the profile banner for the current Kathmandu time and
# recent GitHub activity, then publish it to the orphan `output` branch.
# README.md points at:
#   https://raw.githubusercontent.com/mchalise/mchalise/output/banner.svg

on:
  schedule:
    - cron: "7 * * * *"   # hourly at :07, off the :00 rush (GitHub may delay)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "bake/**"
      - ".github/workflows/banner.yml"

permissions:
  contents: write

concurrency:
  group: banner
  cancel-in-progress: true

jobs:
  banner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Assemble banner
        id: live
        # Note: with the built-in GITHUB_TOKEN the GraphQL contribution
        # calendar only counts PUBLIC contributions. Private ones show up
        # only if "Include private contributions on my profile" is enabled
        # in the user's GitHub profile settings. An API failure never fails
        # the run; live.py falls back to a neutral contrib.json.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: |
          set -o pipefail
          python3 scripts/live.py --out dist/banner.svg | tee live.log
          echo "label=$(sed -n 's/^label *//p' live.log)" >> "$GITHUB_OUTPUT"
          echo "mode=$(sed -n 's/^mode *//p' live.log)" >> "$GITHUB_OUTPUT"
          test -s dist/banner.svg
          printf '# output\n\nGenerated by .github/workflows/banner.yml on main. Do not edit; force-pushed hourly.\n' > dist/README.md

      - name: Publish to orphan `output` branch
        env:
          MSG: "banner: ${{ steps.live.outputs.mode }}, ${{ steps.live.outputs.label }}"
        run: |
          cd dist
          git init -q -b output
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "$MSG"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" output:output
